<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INGCO Mohammedia – Showroom en ligne</title>
<meta name="description" content="Catalogue INGCO Mohammedia : outillage sans fil, électrique, thermique et accessoires. Commandez sur WhatsApp, paiement à la réception, livraison partout au Maroc.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FFA200; --orange-deep:#E58C00; --orange-soft:#FFF1D6;
  --black:#000; --ink:#1B1A18; --mute:#6A655D; --line:#DCD8D1;
  --concrete:#EEECE8; --white:#fff; --wa:#25D366; --wa-deep:#0F8A45; --danger:#C0352B;
  --head:"Barlow Condensed","Cairo",sans-serif; --body:"Barlow","Cairo",system-ui,sans-serif;
  --wrap:1240px; --r:6px;
}
html[lang="ar"]{--head:"Cairo",sans-serif; --body:"Cairo",system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--concrete);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--black);outline-offset:2px}
.on-dark :focus-visible,.on-dark:focus-visible{outline-color:var(--orange)}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.wa-logo{width:1.25em;height:1.25em;fill:currentColor;flex:none}

/* ---------- top bar ---------- */
.topbar{background:var(--black);color:#fff;font-size:.85rem}
.topbar .wrap{display:flex;gap:24px;align-items:center;min-height:36px}
.topbar span{display:flex;align-items:center;gap:8px;color:#E9E6E0}
.topbar span svg{color:var(--orange)}
.topbar .lang{margin-inline-start:auto;background:none;border:1px solid #444;color:#fff;border-radius:999px;padding:3px 14px;font-weight:600}
.topbar .lang:hover{border-color:var(--orange);color:var(--orange)}

/* ---------- header ---------- */
.head{background:var(--orange);position:sticky;top:0;z-index:40;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.head-row{display:flex;align-items:center;gap:20px;min-height:76px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand img{height:52px;width:auto}
.brand b{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.55rem;letter-spacing:.02em;color:var(--black);line-height:1}
.search{position:relative;flex:1;max-width:620px}
.search form{display:flex;background:#fff;border-radius:var(--r);border:2px solid var(--black)}
.search input{flex:1;border:0;background:none;padding:11px 14px;min-width:0;font-size:1rem}
.search input:focus{outline:none}
.search form:focus-within{box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.search button{border:0;background:var(--black);color:#fff;padding:0 18px;display:flex;align-items:center}
.suggest{position:absolute;inset-inline:0;top:calc(100% + 6px);background:#fff;border:2px solid var(--black);border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.18);overflow:hidden;display:none;z-index:50}
.suggest.open{display:block}
.suggest a{display:flex;gap:12px;align-items:center;padding:8px 12px;text-decoration:none;border-bottom:1px solid var(--line)}
.suggest a:hover,.suggest a.hl{background:var(--orange-soft)}
.suggest img,.suggest .noimg{width:44px;height:44px;object-fit:contain;flex:none;background:#fff}
.suggest .s-ref{font-weight:700;font-size:.8rem;color:var(--mute)}
.suggest .s-name{font-size:.92rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.suggest .all{justify-content:center;font-weight:700;border-bottom:0;padding:11px}
.suggest .none{padding:14px;color:var(--mute)}
.head-actions{display:flex;gap:10px;margin-inline-start:auto}
.btn-head{display:flex;align-items:center;gap:8px;text-decoration:none;background:none;border:2px solid var(--black);border-radius:var(--r);padding:9px 14px;font-weight:700;font-family:var(--head);font-size:1.1rem;letter-spacing:.01em;white-space:nowrap}
.btn-head:hover{background:rgba(0,0,0,.08)}
.btn-cart{background:var(--black);color:#fff}
.btn-cart:hover{background:#222}
.btn-cart .count{background:var(--orange);color:var(--black);border-radius:999px;min-width:24px;height:24px;display:inline-grid;place-items:center;font-size:.85rem;padding:0 6px;font-family:var(--body)}
.btn-cart.bump .count{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.35)}}

/* ---------- category nav ---------- */
.catnav{background:var(--black);color:#fff}
.catnav ul{-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent);list-style:none;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:var(--wrap)}
.catnav ul::-webkit-scrollbar{display:none}
.catnav a{display:block;padding:12px 12px;text-decoration:none;white-space:nowrap;font-family:var(--head);font-weight:600;font-size:1.05rem;color:#E9E6E0;border-bottom:3px solid transparent}
.catnav a:hover{color:#fff;border-bottom-color:#555}
.catnav a[aria-current="true"]{color:var(--orange);border-bottom-color:var(--orange)}
.hazard{height:10px;background:repeating-linear-gradient(-45deg,var(--black) 0 14px,var(--orange) 14px 28px)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);border:2px solid transparent;padding:11px 20px;font-weight:700;text-decoration:none;font-size:1rem;line-height:1.2}
.btn-o{background:var(--orange);color:var(--black);border-color:var(--orange)}
.btn-o:hover{background:var(--orange-deep);border-color:var(--orange-deep)}
.btn-k{background:var(--black);color:#fff;border-color:var(--black)}
.btn-k:hover{background:#2a2a2a}
.btn-line{background:transparent;border-color:currentColor}
.btn-wa{background:var(--wa);color:#05361b;border-color:var(--wa)}
.btn-wa:hover{background:#1fbd5a}
.btn-wa-line{background:#fff;color:var(--wa-deep);border-color:var(--wa)}
.btn-wa-line:hover{background:#eafbf0}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:.92rem}

/* ---------- hero ---------- */
.hero{background:var(--black);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#2b2b2b 1.6px,transparent 2.2px) 0 0/24px 24px;opacity:.9}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding-top:64px;padding-bottom:64px}
.hero h1{font-family:var(--head);font-weight:800;font-size:clamp(2.6rem,5.6vw,4.9rem);line-height:.95;margin:0 0 20px;letter-spacing:-.005em}
html[lang="ar"] .hero h1{line-height:1.25;font-size:clamp(2.2rem,4.6vw,4rem)}
.hero h1 .ln2{display:block;color:var(--orange)}
.hero p{font-size:1.15rem;color:#D9D5CE;max-width:52ch;margin:0 0 28px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn-line{color:#fff}
.hero .btn-line:hover{background:rgba(255,255,255,.08)}
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.wall a{position:relative;min-height:0;background:#fff;border-radius:var(--r);aspect-ratio:1;display:grid;place-items:center;padding:12px;text-decoration:none;color:var(--ink)}
.wall a::before{content:"";position:absolute;top:-9px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#555;box-shadow:inset 0 -2px 0 #222}
.wall a img{width:100%;height:100%;object-fit:contain}
.wall a span{position:absolute;bottom:6px;inset-inline-start:8px;font-size:.72rem;font-weight:700;color:var(--mute)}
.wall a:hover{outline:3px solid var(--orange)}

/* ---------- service strip ---------- */
.services{background:#fff;border-bottom:1px solid var(--line)}
.services ul{list-style:none;margin:0 auto;padding:18px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:var(--wrap)}
.services li{display:flex;gap:12px;align-items:flex-start}
.services .ic{width:42px;height:42px;border-radius:50%;background:var(--orange);display:grid;place-items:center;flex:none;color:var(--black)}
.services b{display:block;font-size:.98rem}
.services small{color:var(--mute);font-size:.86rem;line-height:1.35;display:block}

/* ---------- sections ---------- */
.sec{padding:56px 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}
.sec h2,.page h1{font-family:var(--head);font-weight:800;font-size:clamp(1.8rem,3.2vw,2.5rem);line-height:1.05;margin:0}
.sec-head a{font-weight:700;white-space:nowrap}
.sec-head p{margin:6px 0 0;color:var(--mute)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cat{background:#fff;border:2px solid transparent;border-radius:var(--r);text-decoration:none;display:flex;flex-direction:column;padding:14px;gap:10px;min-height:100%}
.cat:hover{border-color:var(--orange)}
.cat .im{aspect-ratio:4/3;display:grid;place-items:center;min-height:0;overflow:hidden}
.cat .im img{width:100%;height:100%;object-fit:contain}
.cat b{font-family:var(--head);font-weight:700;font-size:1.2rem;line-height:1.1}
.cat small{color:var(--mute);margin-top:auto}

.steps{background:var(--orange)}
.steps .wrap{display:grid;grid-template-columns:.9fr 2fr;gap:40px;align-items:start}
.steps h2{color:var(--black)}
.steps .lead{margin:12px 0 0;max-width:34ch}
.steps ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.steps li{background:var(--black);color:#fff;border-radius:var(--r);padding:22px;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--orange);color:var(--black);font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.4rem;margin-bottom:14px}
.steps li b{display:block;font-family:var(--head);font-size:1.3rem;line-height:1.15;margin-bottom:6px}
.steps li span{color:#D9D5CE;font-size:.95rem}

.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}
.row > *{scroll-snap-align:start}

.branches{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.branch{background:#fff;border-radius:var(--r);padding:20px;border-top:5px solid var(--orange)}
.branch b{font-family:var(--head);font-size:1.35rem;display:block;margin-bottom:6px}
.branch p{margin:0 0 14px;color:var(--mute)}
.branch .todo{color:var(--mute);font-style:italic}
.branch .map{width:100%;height:220px;border:0;border-radius:4px;margin-bottom:14px;background:var(--concrete);display:block}
.branch .tel{font-weight:700;color:var(--ink);text-decoration:none;display:inline-block;margin-top:4px}

/* ---------- product cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.card{background:#fff;border-radius:var(--r);display:flex;flex-direction:column;border:1px solid var(--line);overflow:hidden}
.card:hover{border-color:#bdb7ad}
.card-img{display:block;aspect-ratio:1;padding:12px;background:#fff;min-height:0;overflow:hidden}
.card-img img,.card-img .noimg{width:100%;height:100%;object-fit:contain}
.card-body{padding:4px 14px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.ref{font-size:.8rem;font-weight:700;color:var(--mute);letter-spacing:.02em}
.card-title{text-decoration:none;font-weight:600;line-height:1.3;font-size:.97rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-title:hover{text-decoration:underline}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--mute);margin-top:auto;padding-top:6px}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,#999)}
.tag[data-p="sansfil"]{--dot:var(--orange)}
.tag[data-p="electrique"]{--dot:#2F6FDB}
.tag[data-p="thermique"]{--dot:#C0352B}
.tag[data-p="pneumatique"]{--dot:#6B5BD2}
.tag[data-p="accessoire"]{--dot:#8A857C}
.card-act{padding:0 14px 14px}
.add{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--black);color:#fff;border:0;border-radius:var(--r);padding:10px;font-weight:700}
.add:hover{background:#2b2b2b}
.stepper{display:flex;align-items:center;border:2px solid var(--black);border-radius:var(--r);overflow:hidden;background:#fff}
.stepper button{border:0;background:var(--orange);width:40px;height:38px;display:grid;place-items:center;font-size:1.2rem;font-weight:700}
.stepper button:hover{background:var(--orange-deep)}
.stepper output{flex:1;text-align:center;font-weight:700;min-width:36px}
.in-cart{font-size:.78rem;color:var(--wa-deep);font-weight:700;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.noimg{display:grid;place-items:center;text-align:center;color:var(--mute);font-size:.8rem;background:repeating-linear-gradient(-45deg,#f6f5f2 0 10px,#fff 10px 20px);border-radius:4px}

/* ---------- catalogue page ---------- */
.page{padding:28px 0 64px}
.crumbs{font-size:.9rem;color:var(--mute);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--mute)}
.cat-layout{display:grid;grid-template-columns:250px 1fr;gap:28px;align-items:start}
.side{background:#fff;border-radius:var(--r);padding:16px;position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto}
.side h2{font-family:var(--head);font-size:1.2rem;margin:4px 0 8px}
.side ul{list-style:none;margin:0 0 18px;padding:0}
.side a{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:4px;text-decoration:none;font-size:.95rem}
.side a:hover{background:var(--concrete)}
.side a[aria-current="true"]{background:var(--black);color:#fff}
.side a small{color:inherit;opacity:.65}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:16px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:.9rem;font-weight:600;text-decoration:none}
.chip:hover{border-color:var(--black)}
.chip[aria-current="true"]{background:var(--black);color:#fff;border-color:var(--black)}
.chip small{opacity:.65;margin-inline-start:4px}
.count-line{color:var(--mute);margin:6px 0 0}
.sort{display:flex;gap:8px;align-items:center;font-size:.92rem}
.sort select{border:1.5px solid var(--line);border-radius:var(--r);padding:7px 10px;background:#fff}
.more{display:flex;justify-content:center;margin-top:24px}
.empty{background:#fff;border-radius:var(--r);padding:40px;text-align:center}
.empty b{display:block;font-family:var(--head);font-size:1.5rem;margin-bottom:8px}
.mob-cat{display:none}

/* ---------- product page ---------- */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:32px;background:#fff;border-radius:var(--r);padding:28px}
.pd-img{aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r);padding:20px;position:sticky;top:100px;align-self:start;min-height:0;overflow:hidden;width:100%;max-width:460px;justify-self:center}
.pd-img img,.pd-img .noimg{width:100%;height:100%;object-fit:contain}
.pd h1{font-family:var(--head);font-weight:700;font-size:clamp(1.6rem,2.6vw,2.2rem);line-height:1.1;margin:6px 0 12px}
.pd .refline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pd .refline .ref{font-size:1rem;color:var(--ink)}
.copy{border:1px solid var(--line);background:#fff;border-radius:4px;font-size:.8rem;padding:3px 8px}
.pd-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.pd-meta .tag{margin:0;padding:0;font-size:.9rem}
.pd-buy{display:grid;gap:10px;max-width:420px;margin-bottom:10px}
.pd-buy .add{padding:14px;font-size:1.05rem;background:var(--orange);color:var(--black)}
.pd-buy .add:hover{background:var(--orange-deep)}
.pd-buy .stepper button{width:52px;height:48px}
.note{font-size:.9rem;color:var(--mute);margin:4px 0 24px;display:flex;gap:8px;align-items:flex-start}
.specs h2{font-family:var(--head);font-size:1.4rem;margin:0 0 10px}
.specs ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.specs li{padding:8px 0;border-bottom:1px solid var(--line);font-size:.96rem}
.specs li.sub{font-weight:700;padding-top:14px}

/* ---------- drawer ---------- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.veil.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);background:#fff;z-index:90;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s ease;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
[dir="rtl"] .drawer{transform:translateX(-105%)}
[dir="rtl"] .catnav ul{-webkit-mask-image:linear-gradient(270deg,#000 92%,transparent);mask-image:linear-gradient(270deg,#000 92%,transparent)}
.drawer.open{transform:none!important}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--black);color:#fff}
.dr-head h2{margin:0;font-family:var(--head);font-size:1.5rem}
.dr-head button{background:none;border:0;color:#fff;padding:6px;display:grid}
.dr-body{flex:1;overflow:auto;padding:16px 20px}
.line{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line img,.line .noimg{width:64px;height:64px;object-fit:contain;border:1px solid var(--line);border-radius:4px}
.line .nm{font-size:.92rem;line-height:1.3;text-decoration:none;font-weight:600}
.line .ctl{display:flex;gap:10px;align-items:center;margin-top:8px}
.line .stepper{width:130px}
.line .stepper button{width:34px;height:32px}
.rm{background:none;border:0;color:var(--mute);font-size:.85rem;text-decoration:underline;padding:4px}
.rm:hover{color:var(--danger)}
.order{margin-top:18px;display:grid;gap:12px}
.order h3{font-family:var(--head);font-size:1.3rem;margin:6px 0 0}
.fld label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid #bdb7ad;border-radius:var(--r);padding:10px 12px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--black);box-shadow:0 0 0 3px var(--orange-soft)}
.fld .err{color:var(--danger);font-size:.84rem;margin-top:4px;display:none}
.fld.bad input,.fld.bad select{border-color:var(--danger)}
.fld.bad .err{display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{border:1.5px solid #bdb7ad;border-radius:var(--r);padding:10px;display:flex;gap:8px;align-items:center;font-weight:600;font-size:.92rem;cursor:pointer;margin:0}
.seg input{width:auto;margin:0;accent-color:var(--black)}
.seg label:has(input:checked){border-color:var(--black);background:var(--orange-soft)}
.dr-foot{padding:14px 20px;border-top:1px solid var(--line);background:#fafaf8}
.dr-foot p{margin:8px 0 0;font-size:.84rem;color:var(--mute);text-align:center}
.sent{text-align:center;padding:30px 8px}
.sent .ok{width:64px;height:64px;border-radius:50%;background:var(--wa);display:grid;place-items:center;margin:0 auto 16px;color:#fff}
.sent b{display:block;font-family:var(--head);font-size:1.6rem;margin-bottom:8px}
.sent p{color:var(--mute)}
.sent .btns{display:grid;gap:10px;margin-top:20px}

/* ---------- footer ---------- */
footer{background:var(--black);color:#D9D5CE;margin-top:0}
footer .wrap{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:32px;padding-top:44px;padding-bottom:30px}
footer h3{color:#fff;font-family:var(--head);font-size:1.2rem;margin:0 0 12px}
footer ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
footer a{color:#D9D5CE;text-decoration:none}
footer a:hover{color:var(--orange)}
footer .brand b{color:#fff}
footer .legal{border-top:1px solid #2a2a2a;padding:16px 20px;text-align:center;font-size:.85rem;color:#8f8a82}
footer p{margin:12px 0 0;font-size:.95rem}

});
function search(q, list = PRODUCTS){
  const nq = norm(q).trim();
  if (!nq) return list.slice();
  const compact = nq.replace(/[\s\-_.]/g, "");
  const toks = nq.split(/\s+/).filter(Boolean);
  const out = [];
  for (const p of list){
    let s = 0;
    if (p._ref === compact) s = 100;
    else if (compact.length >= 3 && p._ref.startsWith(compact)) s = 80;
    else if (compact.length >= 4 && p._ref.includes(compact)) s = 60;
    if (toks.every(tk => p._name.includes(tk))) s = Math.max(s, 40);
    else if (toks.every(tk => p._hay.includes(tk))) s = Math.max(s, 20);
    if (s) out.push([s, p]);

  out.sort((a, b) => b[0] - a[0] || a[1].i - b[1].i);

/* ---------- helpers ---------- */
function img(p, cls = ""){
  if (!p.m) return `<div class="noimg ${cls}">${esc(t("no_photo"))}</div>`;

}
function waLink(text, number){
  const n = (number || STORE.whatsapp || "").replace(/\D/g, "");

}
function cartQty(){ let n = 0; cart.forEach(q => n += q); return n; }
function saveCart(){ store.set("ingco_cart", [...cart]); }
function toast(msg){

               : `<button class="add" data-action="add" data-id="${p.i}" aria-label="${esc(t("add_cart"))} : ${esc(p.t)}">${ic.plus}${esc(t("add"))}</button>`;
  }

  return big ? `<div class="in-cart">${ic.check}${esc(t("in_cart"))}</div>${st}<button class="btn btn-k" data-action="open-cart">${esc(t("view_cart"))}</button>`

  const b = d.querySelector(".dr-body"); if (b) b.scrollTop = st;

  document.getElementById("veil").classList.add("open");

  setTimeout(() => d.querySelector(".dr-head button")?.focus(), 50);

  const d = document.getElementById("drawer");

  document.getElementById("veil").classList.remove("open");
  document.body.style.overflow = "";

function readForm(f){
  const fd = new FormData(f); const o = {};
  for (const [k, v] of fd) o[k] = String(v).trim();
  return o;
}
function submitOrder(f){
  const o = readForm(f);
  customer = o; store.set("ingco_customer", o);
  const pickup = o.mode === "pickup";
  const bad = [];
  if (o.name.length < 2) bad.push("name");
  if ((o.phone.match(/\d/g) || []).length < 9) bad.push("phone");
  if (!pickup && !o.city) bad.push("city");
  if (!pickup && !o.address) bad.push("address");
  f.querySelectorAll(".fld").forEach(el => el.classList.toggle("bad", bad.includes(el.dataset.f)));
  if (bad.length){ f.querySelector(`[data-f="${bad[0]}"] input`)?.focus(); return; }
  const br = o.branch !== undefined && o.branch !== "" ? STORE.branches[Number(o.branch)] : null;
  const lines = [t("m_hello"), ""];
  let k = 0, total = 0;
  cart.forEach((q, id) => { const p = byId.get(id); k++; total += q; lines.push(`${k}. ${p.r} – ${p.t} × ${q}`); });
  lines.push("", `${t("m_total")} : ${total}`, "",
    `${t("m_name")} : ${o.name}`, `${t("m_phone")} : ${o.phone}`,
    `${t("m_mode")} : ${pickup ? t("f_pickup") : t("f_deliv")}`);
  if (!pickup){ lines.push(`${t("m_city")} : ${o.city}`, `${t("m_address")} : ${o.address}`); }
  if (br) lines.push(`${t("m_branch")} : ${lang === "ar" ? br.ar : br.fr}`);
  if (o.note) lines.push(`${t("m_note")} : ${o.note}`);
  const url = waLink(lines.join("\n"), br && br.whatsapp);
  window.open(url, "_blank", "noopener");
  sentState = true; renderDrawer();
}

  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = t(el.dataset.ph));
  const lb = document.querySelector(".lang");
  lb.textContent = lang === "ar" ? "Français" : "العربية";
  lb.lang = lang === "ar" ? "fr" : "ar";
  const cur = route.cat || "";
  document.getElementById("catnav").innerHTML =
    `<li><a href="#/catalogue" ${route.name === "catalogue" && !cur && !route.q ? 'aria-current="true"' : ""}>${esc(t("all_products"))}</a></li>` +
    CATS.map(c => `<li><a href="#/catalogue?cat=${c.s}" ${cur === c.s ? 'aria-current="true"' : ""}>${esc(catName(c))}</a></li>`).join("");
  document.getElementById("waFloat").href = waLink(t("m_q"));
  document.getElementById("waFloat").innerHTML = WA_SVG;
  document.getElementById("footer").innerHTML = `
    <div class="wrap">
      <div><a class="brand" href="#/"><img src="${document.querySelector('.brand img').src}" alt="INGCO" width="306" height="113" style="height:46px;width:auto"><b>MOHAMMEDIA</b></a><p>${esc(t("f_about"))}</p></div>
      <div><h3>${esc(t("f_cats"))}</h3><ul>${CATS.slice(0, 9).map(c => `<li><a href="#/catalogue?cat=${c.s}">${esc(catName(c))}</a></li>`).join("")}</ul></div>
      <div class="f-cont"><h3 class="f-spacer">&nbsp;</h3><ul>${CATS.slice(9).map(c => `<li><a href="#/catalogue?cat=${c.s}">${esc(catName(c))}</a></li>`).join("")}</ul></div>
      <div><h3>${esc(t("f_help"))}</h3><ul>
        <li><a href="#/" data-action="scroll" data-target="how">${esc(t("f_help1"))}</a></li>
        <li><a href="#" data-action="open-cart">${esc(t("f_help2"))}</a></li>
        <li><a href="${waLink(t("m_q"))}" target="_blank" rel="noopener">${esc(t("f_help3"))}</a></li>
      </ul>
      <h3 style="margin-top:22px">${esc(t("f_branches"))}</h3><ul>${STORE.branches.map(b => `<li>${esc(lang === "ar" ? b.ar : b.fr)}${b.phone ? ` : <a href="tel:${b.phone.replace(/[^\d+]/g, "")}" dir="ltr">${esc(b.phone)}</a>` : ""}${b.lat ? ` – <a href="${mapsLink(b)}" target="_blank" rel="noopener">${esc(t("directions"))}</a>` : ""}</li>`).join("")}</ul></div>
    </div>
    <div class="legal">© ${new Date().getFullYear()} INGCO MOHAMMEDIA. ${esc(t("rights"))}</div>`;
}

/* ---------- router ---------- */
function parseRoute(){
  const h = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = h.split("?");
  const params = new URLSearchParams(qs || "");
  if (path.startsWith("/produit/")) return { name: "produit", id: path.split("/")[2], params, cat: (byId.get(Number(path.split("/")[2])) || {}).c };
  if (path.startsWith("/catalogue")) return { name: "catalogue", params, cat: params.get("cat") || "", q: params.get("q") || "" };
  return { name: "home", params };
}
let lastHash = null;
function render(keepScroll){
  const r = parseRoute();
  renderChrome(r);
  const app = document.getElementById("app");
  if (r.name === "produit") app.innerHTML = viewProduct(r.id);
  else if (r.name === "catalogue") app.innerHTML = viewCatalog(r.params);
  else app.innerHTML = viewHome();
  const qi = document.getElementById("q");
  if (r.name === "catalogue" && document.activeElement !== qi) qi.value = r.q || "";
  const title = r.name === "produit" ? (byId.get(Number(r.id)) || {}).t : r.name === "catalogue" ? (catName(catBySlug.get(r.cat)) || t("nav_catalog")) : null;
  document.title = (title ? title + " | " : "") + "INGCO Mohammedia";
  if (!keepScroll) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { shown = PAGE; render(false); });

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action, id = Number(el.dataset.id);
  if (a === "add"){ cart.set(id, 1); saveCart(); refreshActs(id); updateCount(true); toast(t("added")); }
  else if (a === "inc"){ cart.set(id, (cart.get(id) || 0) + 1); saveCart(); refreshActs(id); updateCount(); if (el.closest("#drawer")) renderDrawer(); }
  else if (a === "dec" || a === "remove"){
    const q = a === "remove" ? 0 : (cart.get(id) || 0) - 1;
    if (q > 0) cart.set(id, q); else cart.delete(id);
    saveCart(); refreshActs(id); updateCount(); if (el.closest("#drawer")) renderDrawer();
  }
  else if (a === "open-cart"){ e.preventDefault(); openCart(); }
  else if (a === "close-cart"){ closeCart(); }
  else if (a === "clear"){ const ids = [...cart.keys()]; cart.clear(); saveCart(); ids.forEach(refreshActs); updateCount(); sentState = false; closeCart(); }
  else if (a === "keep"){ sentState = false; closeCart(); }
  else if (a === "lang"){ lang = lang === "ar" ? "fr" : "ar"; store.set("ingco_lang", lang); render(true); if (document.getElementById("drawer").classList.contains("open")) renderDrawer(); }
  else if (a === "more"){
    const g = document.getElementById("grid"); const from = shown; shown += PAGE;
    g.insertAdjacentHTML("beforeend", lastList.slice(from, shown).map(card).join(""));
    const rest = lastList.length - shown;
    if (rest > 0) el.textContent = `${t("show_more")} (${rest})`; else el.parentElement.remove();
  }
  else if (a === "copy"){
    const r = el.dataset.ref;
    (navigator.clipboard ? navigator.clipboard.writeText(r) : Promise.reject()).then(() => toast(t("copied")), () => {});
  }
  else if (a === "scroll"){
    e.preventDefault();
    const go = () => document.getElementById(el.dataset.target)?.scrollIntoView({behavior: "smooth"});
    if (parseRoute().name !== "home"){ location.hash = "#/"; setTimeout(go, 60); } else go();
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.change === "cat" || el.dataset.change === "sort"){
    const r = parseRoute(); const p = new URLSearchParams(r.params);
    if (el.dataset.change === "cat"){ el.value ? p.set("cat", el.value) : p.delete("cat"); p.delete("type"); }
    else { el.value ? p.set("sort", el.value) : p.delete("sort"); }
    location.hash = "#/catalogue" + (p.toString() ? "?" + p : "");
  }
  if (el.name === "mode"){
    customer = Object.assign(customer, readForm(el.form)); store.set("ingco_customer", customer);
    const pk = el.value === "pickup";
    el.form.querySelector('[data-f="city"]').hidden = pk;
    el.form.querySelector('[data-f="address"]').hidden = pk;
  }
});
document.addEventListener("submit", e => {
  if (e.target.id === "orderForm"){ e.preventDefault(); submitOrder(e.target); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ closeCart(); hideSuggest(); }
});

/* ---------- header search + suggestions ---------- */
const qEl = document.getElementById("q"), sugEl = document.getElementById("suggest");
let sugIdx = -1;
function hideSuggest(){ sugEl.classList.remove("open"); sugIdx = -1; }
function showSuggest(){
  const v = qEl.value.trim();
  if (v.length < 2){ hideSuggest(); return; }
  const res = search(v);
  sugEl.innerHTML = res.length
    ? res.slice(0, 6).map(p => `<a href="#/produit/${p.i}" role="option">${p.m ? `<img src="${p.m}" alt="">` : `<div class="noimg"></div>`}<div><div class="s-ref">${esc(p.r)}</div><div class="s-name" dir="auto">${esc(pName(p))}</div></div></a>`).join("")
      + `<a class="all" href="#/catalogue?q=${encodeURIComponent(v)}">${esc(t("sugg_all"))} (${res.length})</a>`
    : `<div class="none">${esc(t("sugg_none"))}</div>`;
  sugEl.classList.add("open"); sugIdx = -1;
}
qEl.addEventListener("input", showSuggest);
qEl.addEventListener("focus", showSuggest);
qEl.addEventListener("keydown", e => {
  const items = [...sugEl.querySelectorAll("a")];
  if (!items.length || !sugEl.classList.contains("open")) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    sugIdx = (sugIdx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items.forEach((a, i) => a.classList.toggle("hl", i === sugIdx));
  } else if (e.key === "Enter" && sugIdx >= 0){ e.preventDefault(); location.hash = items[sugIdx].getAttribute("href"); hideSuggest(); qEl.blur(); }
});
document.getElementById("searchForm").addEventListener("submit", e => {
  e.preventDefault(); const v = qEl.value.trim(); hideSuggest(); qEl.blur();
  location.hash = v ? "#/catalogue?q=" + encodeURIComponent(v) : "#/catalogue";
});
document.addEventListener("pointerdown", e => { if (!e.target.closest("#search")) hideSuggest(); });
sugEl.addEventListener("click", e => { if (e.target.closest("a")){ hideSuggest(); qEl.blur(); } });

/* ---------- start ---------- */
render(false);
updateCount();
</script>
</body>
</html>
